// ===== RARE ITEMS =====

let rareItems = [



];



// ===== OPEN CASE =====

         let score = 20;
         let canOpen = true

function openCase() {
    
      if (!canOpen) {
        return;
    }

    canOpen = false;

    // Через 1 секунду знову дозволяємо відкривати
    setTimeout(() => {
        canOpen = true;
    }, 1000);

    if (score > 0) {
        score--;

        document.getElementById("text").innerText =
            "Количество обычных ящиков: " + score;

    } else {

        document.getElementById("text").innerText =
            "Лимит на количество открытых ящиков исчерпан. Пожалуйста, подождите 15 минут";

        return;
    }


    let item;

    // 20% шанс на rare
    if (Math.random() < 0.20) {

        let randomRare =
            Math.floor(Math.random() * rareItems.length);

        item = rareItems[randomRare];

    }

    else {

        let randomCommon =
            Math.floor(Math.random() * commonItems.length);

        item = commonItems[randomCommon];
    }



    // IMAGE

    let image = document.getElementById("rewardImage");

    image.src = item.image;



    // NAME

    document.getElementById("nameText").innerText =
        item.name;



    // COLLECTION

    document.getElementById("collectionText").innerText =
        item.collection;



    // RARITY EFFECT

    image.classList.remove("rare");
    image.classList.remove("common");

    image.classList.add(item.rarity);
}
